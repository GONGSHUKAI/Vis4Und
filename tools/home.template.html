<title>Vis4Und</title>
<meta name="description" content="Visualize for Understanding：机器人学、3D 视觉、Agentic RL、分布式训练的可视化预备知识。">
<style>
.home-hero{padding-block:56px 36px;border-bottom:1px solid var(--line)}
.home-hero h1{font-size:clamp(2.6rem,1.6rem + 4.6vw,4.6rem);letter-spacing:-.035em}
.home-hero h1 span{color:var(--muted)}
.home-hero .lede{max-width:38em}
.home-hero .count{font:400 13px/1.4 var(--f-mono);color:var(--muted);margin:18px 0 0}
.sec{padding-block:40px 8px}
.sec+.sec{border-top:1px solid var(--line)}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.sec-h h2{margin:0}
.sec .sec-no{display:inline;margin:0;font-size:15px}
.sec-en{font:400 13px/1.4 var(--f-mono);color:var(--muted)}
.sec-sum{color:var(--ink-2);margin:8px 0 0}
.sec[data-sec="robotics"]{--accent:var(--acc-robotics);--accent-soft:var(--acc-robotics-soft)}
.sec[data-sec="vision3d"]{--accent:var(--acc-3d);--accent-soft:var(--acc-3d-soft)}
.sec[data-sec="agentic-rl"]{--accent:var(--acc-rl);--accent-soft:var(--acc-rl-soft)}
.sec[data-sec="dist-train"]{--accent:var(--acc-dist);--accent-soft:var(--acc-dist-soft)}
.list{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--line)}
.list li{margin:0;border-bottom:1px solid var(--line)}
.list a{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 16px;padding:18px 4px;color:var(--ink);text-decoration:none}
.list a:hover b{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.list .no{font:700 15px/1.6 var(--f-mono);color:var(--accent)}
.list .body{min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.list b{font:700 1.2rem/1.4 var(--f-disp)}
.list i{font:400 13px/1.4 var(--f-mono);font-style:normal;color:var(--muted)}
.list .sum{flex-basis:100%;color:var(--ink-2);font-size:15px;line-height:1.7;margin-top:4px;max-width:46em}
@media (max-width:560px){.list a{grid-template-columns:40px minmax(0,1fr);gap:4px 10px}}
.home-foot{padding-block:40px 56px;color:var(--muted);font-size:14px}
.top-strip{display:flex;justify-content:flex-end;padding-block:10px}
</style>
</head>

</div></header>
